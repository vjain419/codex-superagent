name: Standalone service
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: service
      - run: npm test
        working-directory: service
      - run: node --test deploy/test/*.test.mjs
      - run: sh -n deploy/install-user-service.sh
      - run: node --check service/web/app.js
      - run: npm install --global --ignore-scripts @openai/codex@0.166.0
      - run: node service/test/protocol-smoke.mjs
  container:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f service/Dockerfile -t codex-superagent:ci .
      - run: docker run --rm codex-superagent:ci npm test
